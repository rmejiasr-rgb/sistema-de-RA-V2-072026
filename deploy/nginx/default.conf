# Nginx: sirve el frontend estático y hace de reverse proxy al backend Django.
# TLS termina aquí. Ajustar server_name y rutas de certificados al subdominio
# que asigne TI UNIMET.

upstream backend {
    server web:8000;
}

# Redirección HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    # Permite la validación de Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 15M;

    # Frontend estático (build de Vite)
    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos de Django (admin) y media, servidos directo por nginx
    location /static/ {
        alias /usr/share/nginx/html/static/;
    }
    location /media/ {
        alias /usr/share/nginx/html/media/;
    }

    # API, admin y SSO servidos por Django
    location ~ ^/(api|admin|accounts)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA React: cualquier otra ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
